name: Deploy microservice/project
on:
  workflow_call:
    inputs:
      REF:
        description: "branch, tag, or commit SHA from which the project should be build."
        type: string
      ENVIRONMENT:
        description: "environment"
        type: string
      TAG:
        description: "artifact version tag"
        type: string

env:
  IMAGE_REGISTRY: deenadayalan27

jobs:
  docker-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}
    steps:
      - name: To prove myself
        run: |
            #!/usr/bin/env bash
            set -euo pipefail
            echo "input REF: ${{ inputs.REF }}"
            echo "input ENVIRONMENT: ${{ inputs.ENVIRONMENT }}"
            echo "input TAG: ${{ inputs.TAG }}"
      
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: "${{ inputs.REF }}"

      - name: Deploy application
        run: |
            #!/usr/bin/env bash
            set -euo pipefail
            echo "deploy application"
            echo "environment variables"
            echo "CONTAINER_HOST: ${{ vars.CONTAINER_HOST }}"
            echo "APPS: ${{ vars.APPS }}"
            echo "APP VERSION/TAG: ${{ inputs.TAG }}"
            echo "TEST_ENV_VARIABLE: ${{ env.TEST_ENV_VARIABLE }}"
            cat <<EOF > docker-compose.yml
            version: '3'
            services:
            dr:
              image: ${{ env.IMAGE_REGISTRY }}/dr:${{ inputs.TAG }}
              entrypoint:
                - ""
              command:
                - /bin/sh
                - -c
                - |
                  while true; do
                    echo "Hello world"
                    sleep 60
                  done
            loki:
              image: ${{ env.IMAGE_REGISTRY }}/loki:${{ inputs.TAG }}
              entrypoint:
                - ""
              command:
                - /bin/sh
                - -c
                - |
                  while true; do
                    echo "Hello world"
                    sleep 60
                  done
            thor:
              image: ${{ env.IMAGE_REGISTRY }}/thor:${{ inputs.TAG }}
              entrypoint:
                - ""
              command:
                - /bin/sh
                - -c
                - |
                  while true; do
                    echo "Hello world"
                    sleep 60
                  done
            EOF
            echo "copy docker compose file"
            cat docker-compose.yml
            echo "docker-compose down and docker-compose up -d"
