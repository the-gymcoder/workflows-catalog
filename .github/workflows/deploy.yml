name: Deploy microservice/project
on:
  workflow_call:
    inputs:
      PROJECT_NAME:
        description: "Project(s) to build and deploy as a comma-separated string."
        type: string
        required: true
      REF:
        description: "Branch, tag, or commit SHA from which the project should be built."
        type: string
        required: true
      ENVIRONMENT:
        description: "Target environment"
        type: string
        required: true
      TAG:
        description: "Artifact version tag"
        type: string
        required: true

env:
  IMAGE_REGISTRY: deenadayalan27

jobs:
  docker-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}
    steps:
      - name: Display Inputs and Environment Variables
        run: |
          set -euo pipefail
          echo "PROJECT_NAME: ${{ inputs.PROJECT_NAME }}"
          echo "REF: ${{ inputs.REF }}"
          echo "ENVIRONMENT: ${{ inputs.ENVIRONMENT }}"
          echo "TAG: ${{ inputs.TAG }}"
          echo "==== Environment Variables ===="
          echo "CONTAINER_HOST: ${{ vars.CONTAINER_HOST }}"
          echo "APPS: ${{ vars.APPS }}"

      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: "${{ inputs.REF }}"

      - name: Generate and Deploy Docker Compose File
        run: |
          set -euo pipefail
          echo "Deploying application(s)..."

          # Convert comma-separated PROJECT_NAME into an array
          IFS=',' read -r -a APPS_ARRAY <<< "${{ inputs.PROJECT_NAME }}"

          echo "Apps to deploy: ${APPS_ARRAY[*]}"
          echo "Total apps: ${#APPS_ARRAY[@]}"

          cat <<EOF > docker-compose.yml
          version: '3'
          services:
EOF

          for APP in "${APPS_ARRAY[@]}"; do
            cat <<EOF >> docker-compose.yml
            $APP:
              image: ${{ env.IMAGE_REGISTRY }}/$APP:${{ inputs.TAG }}
              entrypoint:
                - ""
              command:
                - /bin/sh
                - -c
                - |
                  while true; do
                    echo "Hello from $APP"
                    sleep 60
                  done
EOF
          done

          echo "Generated docker-compose.yml:"
          cat docker-compose.yml

          # Deploy using Docker Compose
          #docker-compose down
          #docker-compose up -d
          echo "Docker Compose deployment completed."
