name: Docker Image Scan

on:
  workflow_call:
    inputs:
      REF:
        description: "branch, tag, or commit SHA from which the project should be build."
        type: string
      ENVIRONMENT:
        description: "environment"
        type: string
      TAG:
        description: "artifact version tag"
        type: string
    secrets:
      DOCKERHUB_PASSWORD:
        required: true
env:
  IMAGE_REGISTRY: deenadayalan27

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    env:
      APPS: dr,loki,thor
    container:
      image: docker:stable
      options: --privileged

    services:
      dind:
        image: docker:stable-dind

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: "${{ inputs.REF }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: debug step
        run: |
          hostname
          hostname -i
          pwd
          ls -rlta
          whoami
          docker ps
          docker image ls
          docker pull $IMAGE_REGISTRY/dr:16 

      - name: Install Trivy
        run: |
          apk add --no-cache curl wget
          export TRIVY_VERSION=$(wget -qO - "https://api.github.com/repos/aquasecurity/trivy/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo TRIVY_VERSION: $TRIVY_VERSION
          wget --no-verbose https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz -O - | tar -zxvf -
          mv trivy /usr/local/bin/trivy
          chmod +x /usr/local/bin/trivy
          trivy --version

      - name: Scan images
        run: |
          for app in $APPS; do
            echo "Scanning $app"
            trivy image --exit-code 0 --severity HIGH,CRITICAL --template "@contrib/gitlab.tpl" --no-progress $IMAGE_REGISTRY/dr:16
          done
